[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-delay-bioopt"
version = "0.1.0"
description = "Flight-delay prediction with classical and biologically inspired hyperparameter optimization."
requires-python = ">=3.11,<3.13"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

